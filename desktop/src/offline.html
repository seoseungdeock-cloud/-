<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>SKYNET</title>
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #F7F8FA; color: #191F28; -webkit-app-region: drag; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
  h1 { font-size: 20px; margin: 8px 0 0; letter-spacing: -0.3px; }
  p { margin: 0; color: #6B7684; font-size: 14px; line-height: 1.5; }
  button { -webkit-app-region: no-drag; margin-top: 12px; border: 0; border-radius: 12px; background: #2E5BFF; color: #fff; font-size: 15px; font-weight: 600; padding: 12px 24px; cursor: pointer; }
  button:hover { background: #2149D6; }
  code { color: #8B95A1; font-size: 12px; }
  .mark { width: 56px; height: 56px; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="#191F28"/><g transform="rotate(60 100 100)"><rect x="8" y="42" width="184" height="34" fill="#F7F8FA"/><rect x="8" y="124" width="184" height="34" fill="#F7F8FA"/></g><g transform="rotate(60 100 100)"><rect x="8" y="83" width="184" height="34" fill="#2E5BFF"/></g></svg>
  <h1>서버에 연결할 수 없습니다</h1>
  <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br/>회사 밖이라면 VPN 이 필요할 수 있습니다.</p>
  <button onclick="retry()">다시 연결</button>
  <code id="why"></code>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('why').textContent = q.get('reason') || '';
  function retry() { location.href = q.get('url') || 'https://seoseungdeock-cloud.github.io/-/'; }
  setTimeout(retry, 15000);
</script>
</body>
</html>
